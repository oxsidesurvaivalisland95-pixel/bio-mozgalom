<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOZGALOM CYBER MARKET</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root {
    --neon-blue: #00ffe5;
    --neon-purple: #ff00ff;
    --dark-bg: #05070d;
}

body { 
    margin:0; 
    font-family: 'Segoe UI', Roboto, sans-serif; 
    background: var(--dark-bg); 
    color:white; 
    overflow-x:hidden; 
    min-height:100vh;
}

/* Соцсети в шапке */
.social-links {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 10px;
    background: rgba(0,0,0,0.3);
}
.social-links a {
    text-decoration: none;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 12px;
    border: 1px solid var(--neon-blue);
    border-radius: 20px;
    transition: 0.3s;
}
.social-links a:hover {
    background: var(--neon-blue);
    color: black;
    box-shadow: 0 0 15px var(--neon-blue);
}

.header { text-align:center; padding:30px 20px; }
.header h1 { 
    margin:0; 
    font-size:35px; 
    color: var(--neon-blue); 
    text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
    letter-spacing: 2px;
}
.user-tag { color: var(--neon-purple); font-size: 14px; margin-top: 5px; text-shadow: 0 0 5px var(--neon-purple); }

.nav { 
    display:flex; 
    justify-content:center; 
    flex-wrap:wrap; 
    gap:8px; 
    padding:15px; 
    background: rgba(10, 15, 30, 0.8);
    backdrop-filter: blur(10px);
    position:sticky; 
    top:0; 
    z-index:100;
    border-bottom: 1px solid rgba(0, 255, 229, 0.2);
}

button { 
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
    border: none; 
    padding: 12px 18px; 
    border-radius: 10px; 
    color: white; 
    font-weight: bold; 
    cursor: pointer; 
    transition: 0.2s all;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    text-transform: uppercase;
    font-size: 12px;
}
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px var(--neon-blue);
}
button:active { transform: scale(0.92); }

.page { display:none; padding:20px; padding-bottom:120px; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
.page.active { display:block; }

.card { 
    max-width:400px; 
    margin:15px auto; 
    padding:25px; 
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 255, 229, 0.3);
    border-radius: 16px;
    backdrop-filter: blur(5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: 0.3s;
}
.card:hover { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 255, 229, 0.2); }

input { 
    width:100%; padding:14px; margin:10px 0; 
    border-radius:10px; border:1px solid #333; 
    background:rgba(0,0,0,0.7); color:white; box-sizing:border-box; 
    outline: none;
}
input:focus { border-color: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }

.price-tag { 
    font-size: 18px; color: var(--neon-blue); 
    margin: 15px 0; display: block; font-weight: bold;
    text-shadow: 0 0 5px var(--neon-blue);
}

.order { 
    margin-top:15px; padding:15px; 
    border:1px solid rgba(255,255,255,0.1); 
    border-left:4px solid var(--neon-blue); 
    border-radius:10px; 
    background:rgba(255,255,255,0.02); 
}

.status-paid { color: #00ff00; text-shadow: 0 0 10px #00ff00; font-weight: bold; }
.status-wait { color: #ffae00; text-shadow: 0 0 10px #ffae00; font-weight: bold; }

.cyberRain { position:fixed; top:-20px; color:var(--neon-blue); font-size:12px; pointer-events:none; z-index:-1; animation:fall linear forwards; opacity: 0.4; }
@keyframes fall { to { transform:translateY(110vh); opacity:0; } }

.google-btn { background: white; color: #000; margin-top: 15px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 10px; font-weight: bold; padding: 12px; }
</style>
</head>
<body>

<div class="social-links">
    <a href="https://t.me/mozgalom" target="_blank">✈️ TG КАНАЛ</a>
    <a href="https://www.tiktok.com/@mozgalomovich" target="_blank">🎵 TIKTOK</a>
</div>

<div class="header">
    <h1>MOZGALOM MARKET</h1>
    <div class="user-tag">CYBER SYSTEM 2.0</div>
</div>

<div class="nav">
    <button onclick="show('auth')">ВХОД</button>
    <button onclick="show('shop')">ТОВАРЫ</button>
    <button onclick="show('cart')">КОРЗИНА</button>
    <button onclick="show('history')">ЗАКАЗЫ</button>
    <button onclick="show('admin')" style="background:none; border:1px solid var(--neon-purple); color:var(--neon-purple)">АДМИН</button>
</div>

<div id="auth" class="page active">
    <div class="card" id="authContent">
        <h3>АВТОРИЗАЦИЯ</h3>
        <input id="u_mail" type="email" placeholder="Email">
        <input id="u_pass" type="password" placeholder="Пароль">
        <div style="display:flex; gap:10px;">
            <button onclick="doReg()" style="flex:1">РЕГИСТРАЦИЯ</button>
            <button onclick="doLogin()" style="flex:1">ВОЙТИ</button>
        </div>
        <button class="google-btn" onclick="loginGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Войти через Google
        </button>
    </div>
</div>

<div id="shop" class="page">
    <div class="card">
        <h3>1 НЕДЕЛЯ</h3>
        <span class="price-tag">300₽ / 4$ / 2 TON</span>
        <button onclick="toCart('1 неделя','300₽ / 4$ / 2 TON')" style="width:100%">КУПИТЬ</button>
    </div>
    <div class="card">
        <h3>1 МЕСЯЦ</h3>
        <span class="price-tag">1000₽ / 13$ / 6 TON</span>
        <button onclick="toCart('1 месяц','1000₽ / 13$ / 6 TON')" style="width:100%">КУПИТЬ</button>
    </div>
    <div class="card">
        <h3>НАВСЕГДА</h3>
        <span class="price-tag">4000₽ / 52$ / 25 TON</span>
        <button onclick="toCart('Навсегда','4000₽ / 52$ / 25 TON')" style="width:100%">КУПИТЬ</button>
    </div>
</div>

<div id="cart" class="page">
    <div class="card">
        <h3>КОРЗИНА</h3>
        <div id="cartList">Пусто</div>
        <div id="payArea" style="display:none; margin-top:20px; border-top:1px solid rgba(0,255,229,0.2); padding-top:15px;">
            <p style="font-size:13px; color:var(--neon-blue)">Адрес для оплаты TON:</p>
            <input id="addr" value="UQAYHaet-WWovXy7HoH84ud8cz_VjENJAmuEySnVe9aiw2Dv" readonly>
            <button onclick="copyW()" style="width:100%; background:var(--neon-blue); color:black">КОПИРОВАТЬ АДРЕС</button>
        </div>
    </div>
</div>

<div id="history" class="page">
    <div class="card"><h3>ИСТОРИЯ ЗАКАЗОВ</h3><div id="h_list">Загрузка...</div></div>
</div>

<div id="admin" class="page">
    <div class="card">
        <h3>ADMIN ACCESS</h3>
        <div id="a_lock">
            <input id="a_pass" type="password" placeholder="Пароль">
            <button onclick="goAdmin()" style="width:100%">ВОЙТИ</button>
        </div>
        <div id="a_panel" style="display:none;"><div id="all_orders"></div></div>
    </div>
</div>

<script>
const TG_TOKEN = "8538869779:AAGSu2F22Tx0TAtRH2gXPlF4ZNsPVKTt3lw";
const TG_CHAT_ID = "7910835075";

const firebaseConfig = {
    apiKey: "AIzaSyD94vjwnRQIYC-2Le_nmxtsVKlU6Oww6VE",
    authDomain: "mozgalom-site.firebaseapp.com",
    projectId: "mozgalom-site",
    storageBucket: "mozgalom-site.appspot.com",
    appId: "1:564649897907:web:61503121e661fb6a82a5c6"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function show(id) { 
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); 
    document.getElementById(id).classList.add('active'); 
}

function sendToTG(text) {
    const url = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}`;
    fetch(url, {mode:'no-cors'});
}

function loginGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(()=>location.reload());
}

function doReg() {
    const e = document.getElementById("u_mail").value, p = document.getElementById("u_pass").value;
    auth.createUserWithEmailAndPassword(e,p).then(()=>location.reload());
}
function doLogin() {
    const e = document.getElementById("u_mail").value, p = document.getElementById("u_pass").value;
    auth.signInWithEmailAndPassword(e,p).then(()=>location.reload());
}

let basket = [];
function toCart(n,pr) { basket.push({n,pr}); drawCart(); show('cart'); }
function drawCart() {
    const b = document.getElementById("cartList"), p = document.getElementById("payArea");
    if(!basket.length) { b.innerHTML="Пусто"; p.style.display="none"; return; }
    p.style.display="block";
    b.innerHTML = basket.map((x,i)=>`
        <div class="order"><b>${x.n}</b><br><small>${x.pr}</small><br>
        <button onclick="sendOrder('${x.n}','${x.pr}',${i})" style="margin-top:10px; width:100%">ОФОРМИТЬ</button></div>
    `).join("");
}

function sendOrder(n, pr, i) {
    if(!auth.currentUser) return alert("Войдите в аккаунт!");
    const code = "CB-" + Math.random().toString(36).substr(2,7).toUpperCase();
    db.collection("orders").add({
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        product: n,
        price: pr,
        code: code,
        status: "pending",
        time: Date.now()
    }).then(() => {
        sendToTG(`🚀 НОВЫЙ ЗАКАЗ!\nТовар: ${n}\nEmail: ${auth.currentUser.email}\nКод: ${code}`);
        alert("Заказ создан! Код: "+code);
        basket.splice(i,1); drawCart(); show('history');
    });
}

auth.onAuthStateChanged(u => {
    const h = document.getElementById("h_list");
    if(u) {
        document.getElementById("authContent").innerHTML = `<h3>ПРОФИЛЬ</h3><p>${u.email}</p><button onclick="auth.signOut().then(()=>location.reload())" style="width:100%">ВЫЙТИ</button>`;
        db.collection("orders").where("uid","==",u.uid).onSnapshot(s => {
            if(s.empty) return h.innerHTML = "Заказов нет.";
            h.innerHTML = s.docs.map(d => {
                const x = d.data();
                const isPaid = x.status === 'paid';
                return `<div class="order" style="border-color:${isPaid?'#0f0':'#ffae00'}">
                    <b>${x.product}</b><br>Статус: <span class="${isPaid?'status-paid':'status-wait'}">${isPaid?'ОПЛАЧЕНО ✅':'ОЖИДАНИЕ ⏳'}</span><br>
                    <small>Код: ${x.code}</small></div>`;
            }).join("");
        });
    } else { h.innerHTML = "Войдите, чтобы видеть заказы"; }
});

function goAdmin() {
    if(document.getElementById("a_pass").value === "rahim_45_pro") {
        document.getElementById("a_lock").style.display="none";
        document.getElementById("a_panel").style.display="block";
        db.collection("orders").orderBy("time","desc").onSnapshot(s => {
            document.getElementById("all_orders").innerHTML = s.docs.map(d => {
                const x = d.data();
                const isPaid = x.status === 'paid';
                return `<div class="order" style="border-color:${isPaid?'#0f0':'#ffae00'}">
                    ${x.email}<br><b>${x.product}</b><br>
                    Статус: <b>${isPaid?'ОПЛАЧЕН':'НОВЫЙ'}</b><br>
                    ${!isPaid ? `<button onclick="db.collection('orders').doc('${d.id}').update({status:'paid'})">ОПЛАТА ПОЛУЧЕНА</button>` : ''}
                </div>`;
            }).join("");
        });
    }
}

function copyW() { const i=document.getElementById("addr"); i.select(); navigator.clipboard.writeText(i.value); alert("Скопировано!"); }

setInterval(()=>{
    const r=document.createElement("div"); r.className="cyberRain"; r.innerText="01";
    r.style.left=Math.random()*100+"vw"; r.style.animationDuration=(2+Math.random()*3)+"s";
    document.body.appendChild(r); setTimeout(()=>r.remove(),4000);
},200);
</script>
</body>
</html>
