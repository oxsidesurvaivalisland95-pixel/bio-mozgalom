<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MOZGALOM 2026</title>
    <style>
        body { background: #05070d; color: white; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 100px; }
        .neon-text { color: #00ffe5; text-shadow: 0 0 20px #00ffe5; text-transform: uppercase; margin-top: 50px; }
        
        /* Стили кнопок */
        .btn { 
            background: linear-gradient(45deg, #00ffe5, #ff00ff); 
            border: none; padding: 15px 30px; color: white; border-radius: 10px; 
            cursor: pointer; font-weight: bold; transition: 0.3s; margin: 10px;
        }
        .btn:active { transform: scale(0.9); box-shadow: 0 0 30px #00ffe5; }

        /* Карточки */
        .card { 
            background: rgba(255,255,255,0.05); border: 1px solid #00ffe5; 
            display: inline-block; padding: 20px; border-radius: 20px; margin: 20px;
        }

        /* Твой подвал с ссылками */
        footer { 
            position: fixed; bottom: 0; width: 100%; 
            background: rgba(0,0,0,0.9); padding: 20px 0; 
            border-top: 2px solid #ff00ff; 
        }
        footer a { 
            color: white; text-decoration: none; margin: 0 15px; 
            padding: 10px 20px; border: 1px solid #ff00ff; border-radius: 50px;
            box-shadow: 0 0 10px #ff00ff; transition: 0.3s;
        }
        footer a:hover { background: #ff00ff; box-shadow: 0 0 30px #ff00ff; }
    </style>
</head>
<body>

    <h1 class="neon-text">MOZGALOM MARKET</h1>

    <div class="card">
        <h3>1 НЕДЕЛЯ</h3>
        <p>Цена: 300₽</p>
        <button class="btn" onclick="buy()">КУПИТЬ</button>
    </div>

    <footer>
        <a href="https://t.me/mozgalom" target="_blank">✈️ ТЕЛЕГРАМ</a>
        <a href="https://www.tiktok.com/@mozgalomovich" target="_blank">🎵 ТИКТОК</a>
    </footer>

    <script>
        function buy() {
            let promo = prompt("Введите промокод:");
            if (promo === "fullter2026") {
                alert("СКИДКА АКТИВИРОВАНА! Цена снижена.");
            } else {
                alert("Заказ оформлен без скидки.");
            }
        }
    </script>
</body>
</html>
